<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTMP3 - YouTube to MP3 Converter</title>
  <link rel="icon" href="data:,">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -20%, #2c3150, transparent 55%),
        #090a0f;
      color: #ffffff;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: rgba(18, 19, 27, 0.85);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(112, 104, 255, 0.15);
      color: #9d96ff;
      border: 1px solid rgba(112, 104, 255, 0.3);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 38px;
      letter-spacing: -1.5px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #9b9eaa;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      min-width: 0;
      padding: 16px 18px;
      border: 1px solid #30323d;
      border-radius: 14px;
      outline: none;
      background: #111219;
      color: white;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus {
      border-color: #7068ff;
      box-shadow: 0 0 0 3px rgba(112, 104, 255, 0.2);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 14px;
      padding: 0 24px;
      background: #7068ff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #817aff;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      margin-top: 20px;
      min-height: 22px;
      font-size: 14px;
      color: #aeb1bd;
      line-height: 1.5;
    }

    #status.error {
      color: #ff6b6b;
    }

    #status.success {
      color: #51cf66;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .song-title {
      font-size: 14px;
      font-weight: 600;
      color: #f1f3f5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 14px 20px;
      border-radius: 12px;
      background: #ffffff;
      color: #090a0f;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .download-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .note {
      margin-top: 26px;
      font-size: 12px;
      color: #686b76;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px;
      }
      .input-group {
        flex-direction: column;
      }
      button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge">HQ Audio + Cover Art</span>
    <h1>YTMP3</h1>
    <p class="subtitle">Convert YouTube videos directly to high-quality MP3 with original metadata and embedded thumbnail cover art.</p>

    <form id="form">
      <div class="input-group">
        <input
          id="url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          required
          autocomplete="off"
        />
        <button id="button" type="submit">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">Convert</span>
        </button>
      </div>
    </form>

    <div id="status"></div>

    <div id="result">
      <div id="song-title" class="song-title"></div>
      <a id="download" class="download-btn" href="#" target="_blank">Download MP3</a>
    </div>

    <div class="note">
      Please only download content you have the rights or permission to use.
    </div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const button = document.getElementById("button");
    const spinner = document.getElementById("spinner");
    const btnText = document.getElementById("btn-text");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const songTitle = document.getElementById("song-title");
    const download = document.getElementById("download");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const url = input.value.trim();
      if (!url) return;

      button.disabled = true;
      spinner.style.display = "inline-block";
      btnText.textContent = "Converting...";
      result.style.display = "none";
      status.className = "";
      status.textContent = "Extracting high-quality audio and embedding cover art...";

      try {
        const response = await fetch("/api/convert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Conversion failed.");
        }

        const safeTitle = data.title || "audio";
        status.className = "success";
        status.textContent = "Conversion complete!";
        songTitle.textContent = safeTitle;
        download.href = data.download;
        download.setAttribute("download", `${safeTitle}.mp3`);
        result.style.display = "block";

      } catch (err) {
        status.className = "error";
        status.textContent = err.message || "An unexpected error occurred.";
      } finally {
        button.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Convert";
      }
    });
  </script>
</body>
</html>
